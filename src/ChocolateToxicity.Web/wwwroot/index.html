<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vet Calculator</title>
    <meta name="description" content="Toxicity, emetic, CPR, fluid, CRI and dosing calculators for veterinary professionals." />
    <meta name="theme-color" content="#5d3a1a" />
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="loading">
            <svg class="loading-progress">
                <circle r="40%" cx="50%" cy="50%" />
                <circle r="40%" cx="50%" cy="50%" />
            </svg>
            <div class="loading-progress-text"></div>
            <p>Loading Vet Calculator</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <div id="update-ui" role="status" hidden>
        A new version of Vet Calculator is ready.
        <button type="button" class="reload" onclick="location.reload()">Reload</button>
    </div>
    <script>
        // A new deploy installs a new service worker, which takes over at once. When it replaces the one that loaded
        // this page, offer a reload so the page and its code match the new version.
        if ('serviceWorker' in navigator) {
            const hadController = !!navigator.serviceWorker.controller;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (hadController) {
                    document.getElementById('update-ui').hidden = false;
                }
            });
            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' })
                .then(registration => registration.update())
                .catch(error => console.warn('Service worker registration failed', error));
        }
    </script>
</body>

</html>
